<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{APP_TITLE}}</title>
  <style>{{APP_CSS}}</style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to preview</a>
  <div class="app" id="app">
    <aside class="sidebar left-sidebar" id="leftSidebar">
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <div class="project-identity" id="projectIdentity">
          <h1 id="projectName">view</h1>
          <span class="project-kicker">Local workspace</span>
        </div>
        <button class="icon-button" id="collapseExplorerBtn" aria-label="Hide file explorer" title="Hide file explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>
      <div class="sidebar-search">
        <input type="search" id="treeSearch" aria-label="Filter files" placeholder="Filter files…" autocomplete="off" spellcheck="false">
      </div>
      <nav class="tree" id="tree" role="tree" aria-label="Files" aria-multiselectable="false"><div class="empty">Loading…</div></nav>
    </aside>

    <main class="main">
      <header class="filebar">
        <button class="icon-button" id="explorerBtn" aria-label="Show file explorer" aria-expanded="true" title="Toggle file explorer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4h6l2 3h10v13H3z"></path>
          </svg>
        </button>
        <div class="file-context" id="fileContext" aria-live="polite">
          <span class="file-placeholder">No file selected</span>
        </div>
        <div class="filebar-actions">
          <div class="view-switch" id="viewSwitch" role="group" aria-label="File view" hidden>
            <button class="view-option" type="button" data-view="preview" aria-label="Preview file" title="Preview">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span>Preview</span>
            </button>
            <button class="view-option" type="button" data-view="source" aria-label="View source" title="Source">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
              <span>Source</span>
            </button>
          </div>
          <button class="icon-button" id="wrapBtn" aria-label="Wrap long lines" aria-pressed="false" title="Wrap long lines" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h13a3 3 0 0 1 0 6H7"></path><polyline points="10 9 7 12 10 15"></polyline><line x1="4" y1="18" x2="12" y2="18"></line>
            </svg>
          </button>
          <button class="icon-button" id="copyContentBtn" aria-label="Copy file contents" title="Copy file contents" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button class="icon-button" id="copyPathBtn" aria-label="Copy relative path" title="Copy relative path" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path>
            </svg>
          </button>
          <button class="icon-button" id="outlineBtn" aria-label="Show document outline" aria-expanded="false" title="Document outline" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>
          <button class="icon-button" id="reloadPreviewBtn" aria-label="Reload preview" title="Reload preview" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"></path></svg>
          </button>
          <button class="icon-button" id="openExternalBtn" aria-label="Open preview in new tab" title="Open preview in new tab" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          </button>
          <div class="refresh-state" id="refreshState" title="Files are checked for changes every 5 seconds">
            <span class="refresh-dot"></span><span id="refreshLabel">Watching</span>
          </div>
        </div>
      </header>
      <div class="content" id="content" tabindex="-1">
        <div class="empty">
          <h2>Select a file</h2>
          <p>Choose a file from the explorer to preview it.</p>
        </div>
      </div>
    </main>

    <aside class="sidebar right-sidebar is-hidden" id="rightSidebar" aria-label="Document outline">
      <div class="sidebar-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <h2>Outline</h2>
        <button class="icon-button outline-close" id="outlineCloseBtn" aria-label="Close document outline" title="Close document outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <nav class="outline" id="outline" aria-label="Headings"><div class="empty">No headings</div></nav>
    </aside>
    <button class="panel-scrim" id="panelScrim" aria-label="Close panel" hidden></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>{{APP_PROVIDERS}}</script>
  <script>{{APP_SCRIPT}}</script>
</body>
</html>
